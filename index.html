<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <title>You-teach-share Educational materials market</title>
</head>
<body>
    <h1>Educational Material Uploader</h1> 
    
    <p id="userStatus">Current Status: **Logged out**</p>
    
    <div id="loginForm">
        <h2>Log In to Continue</h2>
        <input type="email" id="emailInput" placeholder="Email Address">
        <input type="password" id="passwordInput" placeholder="Password">
        <button id="loginButton">Log In</button> 
    </div>
    
    <button id="logoutButton" style="display:none;">Log out</button>
    <hr>
    
    <div id="uploaderArea" style="display:none;">
        <h2>Product/Image Uploader</h2> 
        <input type="text" id="productName" placeholder="Product Name"> 
        <input type="file" id="productImage">
        <button id="uploadButton">Upload Product Data</button>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
